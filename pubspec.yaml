name: lentera3
description: "LENTERA - Layanan Informasi Harian Ramah Akses. Aplikasi informasi harian berbasis suara untuk penyandang tunanetra."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  speech_to_text: ^7.3.0     # STT (Speech-to-Text)
  flutter_tts: ^4.2.3        # TTS (Text-to-Speech)
  geolocator: ^14.0.2        # lokasi perangkat
  geocoding: ^4.0.0          # nama tempat dari koordinat
  permission_handler: ^12.0.1 # deteksi izin ditolak permanen + buka pengaturan
  http: ^1.5.0               # klien HTTPS (cuaca + proxy Gemini)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
